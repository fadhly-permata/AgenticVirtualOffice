<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d1526" />
    <title data-i18n="shell.docTitle">VirtOffice — Kantor Isometrik</title>
  </head>
  <body>
    <main id="app">
      <canvas id="scene" data-i18n-aria="shell.sceneAria" aria-label="Diorama kantor isometrik 2.5D bergerak"></canvas>

      <header class="panel panel--brand">
        <span class="brand__mark" aria-hidden="true"></span>
        <div>
          <p class="brand__title" data-i18n="shell.brandTitle">VIRTUAL OFFICE</p>
          <p class="brand__sub" id="brand-version"></p>
        </div>
      </header>

      <section class="panel panel--clock" data-i18n-aria="shell.clockAria" aria-label="Jam kantor">
        <p class="panel__label" data-i18n="shell.clockLabel">Waktu kantor</p>
        <p class="clock__time"><span id="time">08:06</span><span class="clock__phase" id="phase">Pagi</span></p>
        <div class="clock__track"><i id="progress"></i></div>
      </section>

      <section class="panel panel--legend" data-i18n-aria="shell.legendAria" aria-label="Status agen">
        <p class="panel__label">
          <span><span id="agent-count">—</span> <span data-i18n="shell.agentsLabel">Agen</span></span>
          <span class="panel__mode" id="floor-mode">AUTO-PLAY</span>
        </p>
        <ul id="legend"></ul>
      </section>

      <button id="chat-launcher" class="launcher" type="button" aria-haspopup="dialog">
        <span class="launcher__mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
            <path d="M8 9h8M8 13h5" />
          </svg>
        </span>
        <span class="launcher__text">
          <span class="launcher__label" id="launcher-label">Buka workspace</span>
          <span class="launcher__folder" id="launcher-folder" hidden></span>
        </span>
        <span class="launcher__dot" id="launcher-status" aria-hidden="true"></span>
      </button>

      <section id="chat-window" class="chat" data-i18n-aria="shell.chatAria" aria-label="Virtual Command Room" hidden>
        <header
          class="chat__head"
          id="chat-head"
          tabindex="0"
          role="group"
          data-i18n-aria="shell.chatHeadAria"
          data-i18n-title="shell.chatHeadTitle"
          aria-label="Batang judul chat. Seret, atau pakai tombol panah, untuk memindahkan jendela."
          title="Seret untuk memindahkan jendela chat"
        >
          <span class="chat__grip" aria-hidden="true"></span>
          <div class="chat__identity">
            <span class="chat__folder-mark" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z" />
              </svg>
            </span>
            <div class="chat__titles">
              <p class="chat__eyebrow" data-i18n="shell.chatWorkspace">Virtual Command Room</p>
              <p class="chat__folder" id="chat-folder"></p>
            </div>
            <button
              id="chat-change-folder"
              class="icon-btn"
              type="button"
              data-i18n-title="shell.changeWorkspace"
              title="Ganti workspace"
              aria-label="Ganti workspace"
            >
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z" />
                <path d="m14 13 2 2-2 2" />
              </svg>
            </button>
          </div>
          <div class="chat__head-actions">
            <button
              id="chat-new"
              class="icon-btn"
              type="button"
              data-i18n-title="shell.newChat"
              title="Chat baru"
              aria-label="Chat baru"
            >
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
                <path d="M12 5v14M5 12h14" />
              </svg>
            </button>
            <button
              id="chat-maximize"
              class="icon-btn"
              type="button"
              title="Perbesar chat"
              aria-label="Perbesar chat"
              aria-pressed="false"
            >
              <svg class="icon-max" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M16 21h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3" />
              </svg>
              <svg class="icon-restore" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="3.5" />
                <rect x="7" y="7" width="10" height="10" rx="2" />
              </svg>
            </button>
            <button
              id="chat-close"
              class="icon-btn"
              type="button"
              data-i18n-title="shell.closeChat"
              title="Tutup chat"
              aria-label="Tutup chat"
            >
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
                <path d="m6 6 12 12M18 6 6 18" />
              </svg>
            </button>
          </div>
        </header>

        <div id="chat-notice" class="chat__notice" role="status" hidden></div>

        <div class="chat__body">
          <nav
            id="chat-rail"
            class="chat__rail"
            role="tablist"
            aria-orientation="vertical"
            data-i18n-aria="shell.railAria"
            aria-label="Bagian chat"
          >
            <button
              id="chat-tab-agentic"
              class="chat__rail-btn"
              type="button"
              role="tab"
              aria-selected="true"
              aria-controls="chat-page-agentic"
              data-i18n-title="shell.tabAgentic"
              title="Agentic"
              aria-label="Agentic"
            >
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
                <path d="M8.5 9.5h7M8.5 13.5h4" />
              </svg>
            </button>
            <button
              id="chat-tab-files"
              class="chat__rail-btn"
              type="button"
              role="tab"
              aria-selected="false"
              aria-controls="chat-page-files"
              data-i18n-title="shell.tabFiles"
              title="File List"
              aria-label="File List"
            >
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z" />
                <path d="M7 13h8M7 16h5" />
              </svg>
            </button>
            <button
              id="chat-tab-scm"
              class="chat__rail-btn"
              type="button"
              role="tab"
              aria-selected="false"
              aria-controls="chat-page-scm"
              data-i18n-title="shell.tabScm"
              title="Source Control"
              aria-label="Source Control"
            >
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 3v12" />
                <path d="M18 9a3 3 0 1 0-3-3 3 3 0 0 0 3 3Z" />
                <path d="M6 21a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" />
                <path d="M15 6a9 9 0 0 1-9 9" />
              </svg>
            </button>
            <button
              id="chat-tab-terminal"
              class="chat__rail-btn"
              type="button"
              role="tab"
              aria-selected="false"
              aria-controls="chat-page-terminal"
              data-i18n-title="shell.tabTerminal"
              title="Terminal"
              aria-label="Terminal"
            >
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <path d="m5 7 4 5-4 5M12 17h7" />
              </svg>
            </button>
            <button
              id="chat-tab-mobile"
              class="chat__rail-btn chat__rail-btn--tail"
              type="button"
              role="tab"
              aria-selected="false"
              aria-controls="chat-page-mobile"
              data-i18n-title="shell.tabMobile"
              title="Mobile"
              aria-label="Mobile"
            >
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <path d="M8 2.5h8A1.5 1.5 0 0 1 17.5 4v16a1.5 1.5 0 0 1-1.5 1.5H8A1.5 1.5 0 0 1 6.5 20V4A1.5 1.5 0 0 1 8 2.5Z" />
                <path d="M10.5 18h3" />
                <path d="M9.5 6.5h5v5h-5z" />
              </svg>
            </button>
            <button
              id="chat-tab-about"
              class="chat__rail-btn chat__rail-btn--sep"
              type="button"
              role="tab"
              aria-selected="false"
              aria-controls="chat-page-about"
              data-i18n-title="shell.tabAbout"
              title="Tentang"
              aria-label="Tentang"
            >
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="9" />
                <path d="M12 11v6M12 7.6h.01" />
              </svg>
            </button>
            <button
              id="chat-tab-settings"
              class="chat__rail-btn"
              type="button"
              role="tab"
              aria-selected="false"
              aria-controls="chat-page-settings"
              data-i18n-title="shell.tabSettings"
              title="Pengaturan"
              aria-label="Pengaturan"
            >
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3" />
                <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.55V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 8.98 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1.03H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 8.98a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 8.98 4.6h.03A1.7 1.7 0 0 0 10.04 3.05V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1.03 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9v.03a1.7 1.7 0 0 0 1.55 1.03H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1.03Z" />
              </svg>
            </button>
          </nav>

          <div class="chat__pages">
            <section
              id="chat-page-agentic"
              class="chat__page"
              role="tabpanel"
              aria-labelledby="chat-tab-agentic"
              tabindex="-1"
            >
              <div id="chat-selects" class="chat__selects">
                <button
                  id="chat-selects-toggle"
                  class="chat__selects-bar"
                  type="button"
                  aria-expanded="true"
                  aria-controls="chat-selects-fields"
                  title="Sembunyikan panel sesi"
                  aria-label="Sembunyikan panel sesi"
                >
                  <span id="chat-selects-summary" class="chat__selects-summary">Sesi · model · agent</span>
                  <svg class="chat__selects-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m6 15 6-6 6 6" />
                  </svg>
                </button>
                <div id="chat-selects-fields" class="chat__selects-fields">
                  <div class="field field--session">
                    <span data-i18n="shell.fieldSession">Sesi</span>
                    <select id="chat-session" hidden></select>
                  </div>
                  <div class="field">
                    <span data-i18n="shell.fieldModel">Model</span>
                    <select id="chat-model" hidden></select>
                  </div>
                  <div class="field field--agent">
                    <span data-i18n="shell.fieldAgent">Agent</span>
                    <select id="chat-agent" hidden></select>
                  </div>
                </div>
              </div>

              <div id="chat-messages" class="chat__messages" role="log" aria-live="polite"></div>
              <div id="chat-prompts" class="chat__prompts"></div>

              <div class="chat__statusbar">
                <span id="chat-agent-chip" class="chat__agent-chip" hidden></span>
                <span id="chat-status" class="chat__status">Siap</span>
              </div>

              <form id="chat-form" class="chat__composer">
                <textarea
                  id="chat-input"
                  rows="1"
                  data-i18n-placeholder="shell.composerPlaceholder"
                  placeholder="Minta OpenCode mengerjakan sesuatu…"
                  data-i18n-aria="shell.composerAria"
                  autocomplete="off"
                  spellcheck="false"
                  aria-label="Pesan untuk OpenCode"
                ></textarea>
                <div class="chat__composer-actions">
                  <button
                    id="chat-send"
                    class="chat__send"
                    type="button"
                    data-mode="send"
                    title="Kirim"
                    aria-label="Kirim pesan"
                  >
                    <svg class="icon-send" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M12 19V5M6 11l6-6 6 6" />
                    </svg>
                    <svg class="icon-stop" viewBox="0 0 24 24" fill="currentColor" stroke="none">
                      <rect x="7" y="7" width="10" height="10" rx="2.4" />
                    </svg>
                  </button>
                </div>
              </form>
            </section>

            <section
              id="chat-page-files"
              class="chat__page"
              role="tabpanel"
              aria-labelledby="chat-tab-files"
              tabindex="-1"
              hidden
            ></section>
            <section
              id="chat-page-scm"
              class="chat__page"
              role="tabpanel"
              aria-labelledby="chat-tab-scm"
              tabindex="-1"
              hidden
            ></section>
            <section
              id="chat-page-terminal"
              class="chat__page"
              role="tabpanel"
              aria-labelledby="chat-tab-terminal"
              tabindex="-1"
              hidden
            ></section>
            <section
              id="chat-page-mobile"
              class="chat__page"
              role="tabpanel"
              aria-labelledby="chat-tab-mobile"
              tabindex="-1"
              hidden
            ></section>
            <section
              id="chat-page-about"
              class="chat__page"
              role="tabpanel"
              aria-labelledby="chat-tab-about"
              tabindex="-1"
              hidden
            ></section>
            <section
              id="chat-page-settings"
              class="chat__page"
              role="tabpanel"
              aria-labelledby="chat-tab-settings"
              tabindex="-1"
              hidden
            ></section>
          </div>
        </div>
      </section>

      <div id="folder-modal" class="modal" hidden>
        <div class="modal__backdrop" data-folder-close></div>
        <section class="modal__card" role="dialog" aria-modal="true" aria-labelledby="folder-title">
          <header class="modal__head">
            <div>
              <p class="chat__eyebrow" data-i18n="shell.folderEyebrow">Workspace</p>
              <h2 id="folder-title" data-i18n="shell.folderTitle">Buka folder proyek</h2>
            </div>
            <button
              id="folder-close"
              class="icon-btn"
              type="button"
              data-i18n-title="shell.folderClose"
              data-i18n-aria="shell.folderCloseAria"
              title="Tutup"
              aria-label="Tutup pemilih folder"
            >
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
                <path d="m6 6 12 12M18 6 6 18" />
              </svg>
            </button>
          </header>

          <form id="folder-path-form" class="folder__path">
            <button
              id="folder-up"
              class="icon-btn"
              type="button"
              data-i18n-title="shell.folderUp"
              title="Naik satu level"
              aria-label="Naik satu level"
              disabled
            >
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <path d="m5 12 7-7 7 7M12 5v14" />
              </svg>
            </button>
            <input
              id="folder-path"
              type="text"
              data-i18n-placeholder="shell.folderPathPlaceholder"
              placeholder="Tempel path folder…"
              data-i18n-aria="shell.folderPathAria"
              spellcheck="false"
              aria-label="Path folder"
            />
            <button
              class="button button--ghost"
              type="submit"
              data-i18n-title="shell.browseTitle"
              data-i18n="shell.browse"
              title="Tampilkan isi folder"
            >Telusuri</button>
          </form>

          <p id="folder-crumb" class="folder__crumb">Pilih drive atau folder</p>
          <ul id="folder-list" class="folder__list"></ul>

          <div id="folder-recents" class="folder__recents" hidden>
            <p class="chat__eyebrow" data-i18n="shell.recents">Terakhir dibuka</p>
            <div id="folder-recent-list" class="folder__recent-list"></div>
          </div>

          <p id="folder-error" class="folder__error" role="alert" hidden></p>

          <footer class="modal__foot">
            <p id="folder-selection" class="folder__selection">Belum ada folder dipilih</p>
            <div class="modal__actions">
              <button id="folder-cancel" class="button button--ghost" type="button" data-i18n="shell.cancel">Batal</button>
              <button id="folder-open" class="button" type="button" data-i18n="shell.openFolder" disabled>Buka folder ini</button>
            </div>
          </footer>
        </section>
      </div>

      <p id="fatal" class="fatal" hidden></p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
